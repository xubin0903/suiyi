[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "suiyi-engine"
dynamic = ["version"]
description = "随译本地翻译引擎。CTranslate2 / OPUS-MT 推理、语种路由、分句拼回与本机 HTTP API。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# 运行时：语种检测 py3langid；翻译推理 ctranslate2 与 sentencepiece；
# 本机 HTTP 用 fastapi 与 uvicorn。不要给 uvicorn 加 standard extra，以免带上
# httptools、uvloop、watchfiles 等打包时用不到的额外依赖。
# torch、transformers、huggingface_hub 只在可选组 convert，不能进运行时。
dependencies = [
  "py3langid>=0.4.0,<0.5",
  "ctranslate2>=4.6",
  "sentencepiece>=0.2",
  "fastapi>=0.115",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  # Starlette TestClient 需要 httpx2。只在测试里用，不放进运行时。
  "httpx2>=2",
]
# 只用于 scripts/convert_models.py。torch 用 CPU 版即可，安装命令见 docs/engine/模型目录约定.md。
convert = [
  "ctranslate2>=4.6",
  "huggingface_hub>=0.26",
  "sentencepiece>=0.2",
  "transformers>=4.45",
  "torch>=2.2",
]

[tool.hatch.version]
path = "src/suiyi_engine/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W：pycodestyle；F：Pyflakes；I：isort；UP：pyupgrade；B：flake8-bugbear。
# 未加 D/ANN/S 等更严规则，避免空骨架被文档与注解检查淹没；需要时再扩展。
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "model: 需要真实模型。未设置 SUIYI_MODELS_DIR 或目录不存在时跳过，CI 不下载模型。",
]
