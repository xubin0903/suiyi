# 随译 CI。
# 触发：发往 main 的 pull_request，以及推送到 main。
# 权限：只读检出。不发布、不签名、不改分支保护。
#
# 路径过滤取舍：
# 不用 workflow 级 paths。文档类 PR 若因此整份工作流被跳过，
# 将来把某个 job 设为必需检查时，GitHub 会把它当成「未运行」而卡住合并。
# 这里改为 job 级过滤：文档类 PR 仍会跑「变更检测」「engine 检查」「client 检查」，
# 但跳过真正的 lint/build/test。
#
# 两项稳定汇总检查：
# - 「engine 检查」：engine/** 或工作流有变更时，engine 矩阵必须 success；否则必须 skipped。
# - 「client 检查」：client/** 或工作流有变更时，client job 必须 success；否则必须 skipped。
# 分支保护应只要求「CI / engine 检查」与「CI / client 检查」，
# 不要要求矩阵里的 ubuntu/windows job 或 client（windows-latest）job。

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Windows runner 默认是 PowerShell，方括号会被当成通配符。统一用 bash。
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: 变更检测
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.filter.outputs.engine }}
      client: ${{ steps.filter.outputs.client }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          # 空 token 时 paths-filter 用 git diff，需要能取到基线提交。
          fetch-depth: 0

      # token 置空，走 git diff，避免再申请 pull-requests: read。
      - name: 判断是否需要跑 engine / client
        id: filter
        uses: dorny/paths-filter@v3
        with:
          token: ""
          filters: |
            engine:
              - 'engine/**'
              - '.github/workflows/**'
            client:
              - 'client/**'
              - '.github/workflows/**'

  engine:
    name: engine（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    needs: changes
    if: ${{ needs.changes.outputs.engine == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - name: 安装开发依赖
        # eval 只为指标单测提供 sacrebleu / psutil。不设置 SUIYI_MODELS_DIR，不跑真实评测。
        run: pip install -e "engine[dev,eval]"

      - name: ruff check
        run: ruff check engine

      - name: ruff format
        run: ruff format --check engine

      - name: pytest
        # 不设置 SUIYI_MODELS_DIR，也不下载模型。
        # @pytest.mark.model 由 engine/tests/conftest.py 跳过。
        run: pytest engine

      - name: OCR 依赖审计与模型测试（干净 venv 安装 engine[ocr]，#51 / #52）
        # 确认 OCR 可选组不带进 torch / paddlepaddle / transformers，并在 Windows / Linux 上各识别一次，
        # 再用同一批模型跑 OCR 核心的测试。
        # 不从网络下载模型：用 rapidocr wheel 自带的三个 ONNX（与 engine/ocr_model_manifest.json 的
        # 推荐组合同一字节，check 会校验 sha256）。smoke 在进程内禁止任何网络连接。
        # Windows runner 的管道默认 cp1252，中文输出会 UnicodeEncodeError，所以开 UTF-8 模式。
        env:
          PYTHONUTF8: "1"
        run: |
          python -m venv "$RUNNER_TEMP/ocr-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            PY="$RUNNER_TEMP/ocr-venv/Scripts/python.exe"
          else
            PY="$RUNNER_TEMP/ocr-venv/bin/python"
          fi
          "$PY" -m pip install --quiet --upgrade pip
          # 可编辑安装：OcrEngine 默认从仓库里读 engine/ocr_model_manifest.json；dev 组提供 pytest
          "$PY" -m pip install --quiet -e "./engine[ocr,dev]"
          "$PY" -m pip list
          "$PY" scripts/download_ocr_models.py audit
          MODELS="$RUNNER_TEMP/ocr-models"
          mkdir -p "$MODELS/ocr"
          "$PY" -c "import pathlib, rapidocr, shutil, sys; [shutil.copy2(p, sys.argv[1]) for p in (pathlib.Path(rapidocr.__file__).parent / 'models').glob('*.onnx')]" "$MODELS/ocr"
          OCR_ARGS=(--manifest engine/ocr_model_manifest.json --models-dir "$MODELS")
          "$PY" scripts/download_ocr_models.py "${OCR_ARGS[@]}" check
          "$PY" -c "import sys; from PIL import Image, ImageDraw, ImageFont; im = Image.new('RGB', (720, 120), 'white'); ImageDraw.Draw(im).text((20, 30), 'Suiyi offline OCR 2026', font=ImageFont.load_default(size=44), fill='black'); im.save(sys.argv[1])" "$RUNNER_TEMP/ocr.png"
          "$PY" scripts/download_ocr_models.py "${OCR_ARGS[@]}" smoke "$RUNNER_TEMP/ocr.png"
          # #52 OCR 核心 + #53 OCR 接口：真实模型上的中英日识别、段落合并、竖排顺序、并发，
          # 以及需要 PIL 解码的接口用例（OCR 模型测试不允许跳过）
          SUIYI_MODELS_DIR="$MODELS" SUIYI_OCR_TESTS_REQUIRED=1 "$PY" -m pytest -rs \
            engine/tests/test_ocr_layout.py engine/tests/test_ocr_engine.py engine/tests/test_ocr_model.py \
            engine/tests/test_ocr_http.py
          # 供下一步复用同一个 venv 与模型目录
          echo "OCR_PY=$PY" >> "$GITHUB_ENV"
          echo "OCR_MODELS=$MODELS" >> "$GITHUB_ENV"

      - name: OCR 评测快速子集（CI 环境数据，#54）
        # 验证 scripts/eval_ocr.py 在 Windows / Linux 上一条命令能跑通并写出报告与 JSON。
        # 只有 wheel 自带的 det small（不下载 tiny）；另跑一个调优变体，验证实验开关在两个平台可用。
        # 耗时是 GitHub 托管 runner 的数据，只用于确认脚本可用，不作为性能基线。
        # psutil 在审计之后单独装，不影响上一步的依赖审计。
        env:
          PYTHONUTF8: "1"
        run: |
          "$OCR_PY" -m pip install --quiet "psutil>=5.9"
          "$OCR_PY" scripts/eval_ocr.py --quick --det small,small@960+rb1+nomp \
            --models-dir "$OCR_MODELS" --label "CI ${RUNNER_OS}（GitHub 托管 runner）" \
            --out "$RUNNER_TEMP/ocr-eval"
          cat "$RUNNER_TEMP/ocr-eval/report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 OCR 评测报告
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ocr-eval-${{ matrix.os }}
          path: ${{ runner.temp }}/ocr-eval
          if-no-files-found: ignore

  # 稳定的汇总检查，供将来分支保护使用。
  # engine 矩阵被跳过时本 job 仍成功；矩阵失败或被取消时本 job 失败。
  engine-check:
    name: engine 检查
    needs: [changes, engine]
    if: ${{ always() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总 engine 结果
        run: |
          filter="${{ needs.changes.outputs.engine }}"
          result="${{ needs.engine.result }}"
          echo "engine 路径是否变更: ${filter}"
          echo "engine job 结果: ${result}"
          if [ "$filter" = "true" ]; then
            if [ "$result" != "success" ]; then
              echo "engine 或工作流有变更，但测试 job 不是 success。"
              exit 1
            fi
          elif [ "$filter" = "false" ]; then
            if [ "$result" != "skipped" ]; then
              echo "本次变更不应跑 engine，实际结果是 ${result}。"
              exit 1
            fi
          else
            echo "无法识别的过滤结果: ${filter}"
            exit 1
          fi

  # 不要把是否启用写在 job 级 hashFiles('client/**/*.csproj') 上：
  # hashFiles 在 checkout 之前求值，工作区还是空的，条件会一直为假。改用 changes 的输出。
  client:
    name: client（windows-latest）
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: client/global.json

      # setup-dotnet 的内置缓存要求 packages.lock.json，这里直接缓存 NuGet 全局包目录。
      - name: NuGet 缓存
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('client/**/*.csproj', 'client/Directory.Packages.props', 'client/Directory.Build.props', 'client/global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: dotnet restore
        run: dotnet restore client/Suiyi.sln

      - name: dotnet format
        run: dotnet format client/Suiyi.sln --verify-no-changes --no-restore

      - name: dotnet build
        run: dotnet build client/Suiyi.sln -c Release --no-restore

      - name: dotnet test
        run: dotnet test client/Suiyi.sln -c Release --no-build

  # 稳定的汇总检查，与「engine 检查」对称。
  # client job 被跳过时本 job 仍成功；client job 失败或被取消时本 job 失败。
  client-check:
    name: client 检查
    needs: [changes, client]
    if: ${{ always() && needs.changes.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: 汇总 client 结果
        run: |
          filter="${{ needs.changes.outputs.client }}"
          result="${{ needs.client.result }}"
          echo "client 路径是否变更: ${filter}"
          echo "client job 结果: ${result}"
          if [ "$filter" = "true" ]; then
            if [ "$result" != "success" ]; then
              echo "client 或工作流有变更，但 client job 不是 success。"
              exit 1
            fi
          elif [ "$filter" = "false" ]; then
            if [ "$result" != "skipped" ]; then
              echo "本次变更不应跑 client，实际结果是 ${result}。"
              exit 1
            fi
          else
            echo "无法识别的过滤结果: ${filter}"
            exit 1
          fi
